<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DustwireMP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <h1>DustwireMP</h1>
    <p>Server connection UI prototype</p>
    <label>Host<input id="host" value="127.0.0.1"></label>
    <label>Port<input id="port" type="number" value="4674"></label>
    <label>Name<input id="name" value="Player"></label>
    <button id="connect">Connect</button>
    <pre id="status">offline</pre>
  </main>
  <script>
    const api = window.rdrmp || {
      connectToServer: (host, port, name) => console.log('CEF stub', host, port, name)
    };
    document.getElementById('connect').onclick = () => {
      const host = document.getElementById('host').value;
      const port = Number(document.getElementById('port').value);
      const name = document.getElementById('name').value;
      document.getElementById('status').textContent = `connecting to ${host}:${port}`;
      api.connectToServer(host, port, name);
    };
  </script>
</body>
</html>
