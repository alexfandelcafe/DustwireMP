# DustwireMP v0.3 launcher configuration.
# Relative paths are resolved from the launcher executable directory.

game_path=RDR.exe
client_dll=DustwireMPClientModule.dll
target_process=RDR.exe
wait_for_game_ms=30000
require_x64=true

