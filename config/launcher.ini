# DustwireMP v0.3 launcher configuration.
# Relative paths are resolved from the launcher executable directory.

game_path=RDR.exe
client_dll=DustwireMPClientModule.dll
target_process=RDR.exe
wait_for_game_ms=30000
require_x64=true

# Optional exact build profile.
# Keep these at 0 while discovering the target build.
expected_machine=0
expected_timestamp=0
expected_image_size=0
expected_file_size=0

# Example for a future strict profile:
# expected_machine=0x8664
# expected_timestamp=0x12345678
# expected_image_size=0x1000000
# expected_file_size=123456789
