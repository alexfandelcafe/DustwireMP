# Keep these at 0/empty while discovering the target build.
expected_machine=0
expected_timestamp=0
expected_image_size=0
expected_file_size=0
expected_text_rva=0
expected_text_size=0
expected_text_fnv1a64=0
expected_file_version=
expected_sha256=

